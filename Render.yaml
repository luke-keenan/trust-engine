# render.yaml (repo root)
services:
  - type: web
    name: trust-engine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data.db

  - type: static
    name: trust-engine-frontend
    buildCommand: pnpm install && pnpm run build
    publishDirectory: dist
    routes:
      - type: rewrite
        source: /{.*}
        destination: /$1   