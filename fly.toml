# fly.toml app configuration file generated for trust-engine on 2026-10-17T02:10:03+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trust-engine'
primary_region = 'sin'

[build]
  dockerfile = "backend/Dockerfile"
  context = "backend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

